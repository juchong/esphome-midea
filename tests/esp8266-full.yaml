esphome:
  name: midea-esp8266-ci

esp8266:
  board: esp12e
  framework:
    version: recommended

external_components:
  - source:
      type: local
      path: ../components
    components: [midea]

logger:
  baud_rate: 0

wifi:
  ssid: "compile-test"
  password: "compile-test-password"

uart:
  id: midea_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

climate:
  - platform: midea
    id: test_midea
    name: Test Midea
    uart_id: midea_uart
    autoconf: true
    beeper: false
    diagnostic_interval: 10s
    property_interval: 30s
    power_format: BCD
    outdoor_temperature:
      name: Outdoor temperature
    power_usage:
      name: Realtime power
    humidity_setpoint:
      name: Target humidity
    indoor_humidity:
      name: Indoor humidity
